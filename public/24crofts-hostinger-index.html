<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 Crofts — 24crofts.com Cinema 24 Crafts Talent & Production Platform</title>
  <meta name="description" content="A secure matrimonial platform connecting film professionals with curated profiles, categorized departments, and integrated promotional media advertising features." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF9F6;
      --surface: #FFFFFF;
      --surface-muted: #F3F1EC;
      --text: #141413;
      --text-secondary: #52514E;
      --text-muted: #787671;
      --accent: #BE123C;
      --accent-hover: #9F1239;
      --gold: #D97706;
      --green: #15803D;
      --border: #E6E4DD;
      --border-strong: #DEDBD2;
      --dark: #0F0E0D;
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans Telugu', 'Noto Sans Devanagari', system-ui, sans-serif;
      --font-display: 'Outfit', 'Noto Sans Telugu', 'Noto Sans Devanagari', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .font-display { font-family: var(--font-display); line-height: 1.22; }
    .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; }
    .container { max-width: 1360px; margin: 0 auto; padding: 0 20px; }
    /* Header & Toolbar */
    .site-header {
      position: sticky; top: 0; z-index: 40;
      background: rgba(250, 249, 246, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 20px; max-width: 1360px; margin: 0 auto;
      flex-wrap: wrap;
    }
    .brand {
      font-family: var(--font-display); font-size: 1.35rem; font-weight: 700;
      color: var(--text); background: none; border: none; letter-spacing: -0.02em;
    }
    .brand:hover { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .nav-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 4px 0; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary);
    }
    .nav-btn.active, .nav-btn:hover { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 10px; font-size: 0.82rem; font-weight: 600;
      border: 1px solid transparent; transition: 0.16s ease; text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-dark { background: var(--text); color: #fff; }
    .btn-dark:hover { background: var(--accent); }
    .btn-gold { background: #B45309; color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-outline { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
    .btn-outline:hover { border-color: var(--text); background: var(--surface-muted); }
    .toolbar {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 20px;
    }
    .toolbar-inner {
      max-width: 1360px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .search-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 280px; flex-wrap: wrap; }
    .input, .select, .textarea {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--border-strong); background: var(--bg);
      font-size: 0.85rem; color: var(--text);
    }
    .input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .lang-switch { display: inline-flex; background: var(--surface-muted); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .lang-btn { border: none; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); }
    .lang-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    /* Hero & Stats */
    .hero-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; margin-top: 24px;
    }
    .hero-grid { display: grid; grid-template-columns: 7fr 5fr; }
    .hero-copy { padding: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
    .kicker { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
    .hero-title { font-size: clamp(1.75rem, 3vw, 2.55rem); font-weight: 700; color: var(--text); margin-top: 6px; }
    .hero-sub { font-size: 0.95rem; color: var(--text-secondary); max-width: 62ch; margin-top: 10px; }
    .hero-media { position: relative; min-height: 300px; background: var(--dark); }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
    .hero-caption {
      position: absolute; inset: auto 0 0 0; padding: 18px 22px;
      background: linear-gradient(to top, rgba(0,0,0,0.88), transparent); color: #fff; font-size: 0.78rem;
    }
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border); background: var(--bg);
    }
    .stat-cell { padding: 16px 22px; border-right: 1px solid var(--border); }
    .stat-cell:last-child { border-right: none; }
    .stat-num { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 0.76rem; color: var(--text-secondary); margin-top: 2px; }
    /* Sections & Grids */
    .section { margin-top: 36px; }
    .section-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    /* Dark Theatrical Ad Box */
    .theater-box {
      background: var(--dark); color: var(--bg); border-radius: 20px;
      padding: 28px; border: 1px solid #262522; margin-bottom: 22px;
    }
    .ad-card-dark {
      background: #181715; border: 1px solid #2E2D2A; border-radius: 14px;
      overflow: hidden; text-align: left; color: #fff; display: flex; flex-direction: column;

    .ad-card-dark:hover { border-color: var(--accent); }
    .ad-card-light {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; text-align: left; color: var(--text); display: flex; flex-direction: column;
    }
    .ad-card-light:hover { border-color: var(--text); }
    .ad-thumb { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    .ad-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .ad-badge {

      background: rgba(0,0,0,0.78); color: #FBBF24; font-family: var(--font-mono);

    .ad-body { padding: 14px; }
    /* Profile Cards */
    .profile-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      transition: border-color 0.16s ease;
    }
    .profile-card:hover { border-color: var(--text); }
    .profile-media { position: relative; aspect-ratio: 4/3; background: #141413; overflow: hidden; }
    .profile-media img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .id-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(20,20,19,0.88); color: #fff; font-family: var(--font-mono);
      font-size: 0.72rem; font-weight: 700; padding: 4px 9px; border-radius: 6px;
    }
    .tier-badge {
      position: absolute; top: 10px; right: 10px;
      font-size: 0.7rem; font-weight: 700; padding: 4px 9px; border-radius: 6px;
    }
    .tier-paid { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
    .tier-today { background: #DCFCE7; color: #166534; }
    .profile-body { padding: 16px; space-y: 8px; }
    .profile-meta { font-size: 0.74rem; color: var(--text-muted); font-family: var(--font-mono); }
    .profile-name { font-size: 1.08rem; font-weight: 700; margin-top: 4px; color: var(--text); }
    .profile-role { font-size: 0.82rem; font-weight: 600; color: var(--accent); }
    .profile-bio { font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .contact-strip {
      margin-top: 10px; padding: 8px 10px; border-radius: 8px;
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
    }
    .contact-locked { background: var(--surface-muted); color: var(--text-secondary); }
    .contact-unlocked { background: #ECFDF5; color: var(--green); border: 1px solid #A7F3D0; }
    .profile-foot {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    /* Craft Cards */
    .craft-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    }
    .craft-card:hover { border-color: var(--accent); }
    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(15, 14, 13, 0.72);
      display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
    }
    .modal-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      max-width: 960px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px;
    }
    /* Forms & Portals */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; }
    .label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text); margin-bottom: 5px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 8px; padding: 12px; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 80;
      background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px;
      font-size: 0.82rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--text-muted); font-weight: 600; background: var(--bg); }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

              <h2 style="font-size:1.3rem;margin-bottom:12px;">Server Hosting, Database Security & Mobile App Maintenance Cost Estimate (INR)</h2>
              <table>
                <thead><tr><th>Component</th><th>Specification</th><th>Monthly (INR)</th><th>Annual (INR)</th></tr></thead>
                <tbody>
                  <tr><td>Cloud Web & PWA Hosting</td><td>Auto-Scaling Edge CDN + SSL/TLS 1.3</td><td class="font-mono">₹4,500 – ₹9,500</td><td class="font-mono">₹54,000 – ₹1,14,000</td></tr>
                  <tr><td>Encrypted Database Vault</td><td>AES-256-GCM PII Vault + Daily Backups</td><td class="font-mono">₹3,200 – ₹6,800</td><td class="font-mono">₹38,400 – ₹81,600</td></tr>
                  <tr><td>Media Storage & CDN</td><td>25 Photos/Profile + Movie Registration Docs</td><td class="font-mono">₹2,000 – ₹5,500</td><td class="font-mono">₹24,000 – ₹66,000</td></tr>
                  <tr><td>WAF, DDoS & OTP Gateway</td><td>Anti-Scraping Firewall & Audit Logs</td><td class="font-mono">₹1,800 – ₹3,500</td><td class="font-mono">₹21,600 – ₹42,000</td></tr>
                  <tr><td>iOS/Android Stores & Domain</td><td>24crofts.com Renewal & Maintenance</td><td class="font-mono">₹2,500 – ₹5,000</td><td class="font-mono">₹30,000 – ₹60,000</td></tr>
                </tbody>
              </table>
            </div>
          ` : ''}
        </section>
      `;
    }

    // =========================================================================
    // 9. MODALS (PROFILE MODAL, YOUTUBE PLAYER MODAL, UPLOAD AD MODAL)
    // =========================================================================
    function renderProfileModal() {
      const p = db.profiles.find(item => item.id.toUpperCase() === ui.activeProfileId.toUpperCase());
      if (!p) return '';
      const unlocked = canViewContacts();
      const cd = p.castingDetails || {};
      const embed = getYoutubeEmbed(p.youtubeLinks[0]);

      return `
        <div class="modal-backdrop" onclick="if(event.target===this){ui.activeProfileId=null;render();}">
          <div class="modal-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);padding-bottom:14px;">
              <div>
                <span class="font-mono" style="font-size:0.78rem;font-weight:700;color:var(--accent);">UNIQUE ID: ${p.id} · ${p.industry}</span>
                <h2 style="font-size:1.55rem;">${p.fullName} (${p.screenName})</h2>
                <div style="font-size:0.86rem;color:var(--text-secondary);">${p.subCategory} · ${p.city}, ${p.state} · Languages (${p.languages.length}): ${p.languages.join(', ')}</div>
              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-outline" onclick="shareProfile('${p.id}')">Share Link (${p.id})</button>
                <button class="btn btn-dark" onclick="ui.activeProfileId=null;render()">✕ Close</button>
              </div>
            </div>

            <div class="grid-3" style="margin-top:18px;grid-template-columns: 1fr 2fr;">
              <div>
                <img src="${p.photos[0]}" alt="${p.fullName}" style="width:100%;border-radius:14px;border:1px solid var(--border);" />
                <div class="contact-strip ${unlocked ? 'contact-unlocked' : 'contact-locked'}" style="margin-top:12px;padding:12px;">
                  <strong>Matrimonial Contact Vault</strong><br/>
                  ${unlocked
                    ? `Mobile: ${p.phoneFull}<br/>Email: ${p.emailFull}<br/>Aadhaar: ${p.aadhaarFull}`
                    : `Mobile: ${p.phoneMasked}<br/>Aadhaar: ${p.aadhaarMasked}<br/><span style="font-size:0.72rem;">Only Admin & Approved Production Houses can view contact numbers.</span>`}
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:14px;">
                <p style="font-size:0.9rem;">${p.bio}</p>
                <div style="background:var(--bg);padding:14px;border-radius:12px;border:1px solid var(--border);font-size:0.8rem;">
                  <strong>Complete Casting Category Portfolio Specifications</strong>
                  <div class="form-grid" style="margin-top:8px;grid-template-columns:repeat(3,1fr);gap:8px;">
                    <div><strong>Age:</strong> ${cd.age || 25}</div>
                    <div><strong>Height:</strong> ${cd.height || '5 ft 8 in'}</div>
                    <div><strong>Weight:</strong> ${cd.weight || '62 kg'}</div>
                    <div><strong>Bust/Chest:</strong> ${cd.bust || '36 in'}</div>
                    <div><strong>Waist:</strong> ${cd.waist || '28 in'}</div>
                    <div><strong>Hip:</strong> ${cd.hip || '36 in'}</div>
                    <div><strong>Skin Tone:</strong> ${cd.skinTone || 'Wheatish'}</div>
                    <div><strong>Eye/Hair:</strong> ${cd.eyeColour || 'Brown'} / ${cd.hairColour || 'Black'}</div>
                    <div><strong>Shoe Size:</strong> ${cd.shoeSize || 'UK 8'}</div>
                    <div><strong>Passport:</strong> ${cd.passport || 'Yes'}</div>
                    <div><strong>Outstation/Abroad:</strong> Yes / Yes</div>
                    <div><strong>Instagram:</strong> ${cd.instagramId || '@24crofts'}</div>
                  </div>
                  <div style="margin-top:8px;"><strong>Interested In:</strong> ${(cd.interestedIn || []).join(', ')}</div>
                  <div style="margin-top:4px;"><strong>Comfortable With:</strong> ${(cd.comfortableWith || []).join(', ')}</div>
                </div>
                ${embed ? `<iframe src="${embed}" style="width:100%;height:240px;border:none;border-radius:12px;" allowfullscreen></iframe>` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderVideoModal() {
      const embed = getYoutubeEmbed(ui.activeYoutubeUrl);
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){ui.activeYoutubeUrl=null;render();}">
          <div class="modal-card" style="max-width:760px;background:#141413;color:#fff;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h3 style="color:#fff;">24crofts.com Theatrical Screening Room</h3>
              <button class="btn btn-primary" onclick="ui.activeYoutubeUrl=null;render()">✕ Close</button>
            </div>
            ${embed ? `<iframe src="${embed}" style="width:100%;aspect-ratio:16/9;border:none;border-radius:12px;" allowfullscreen></iframe>` : `<p>Video Preview Ready</p>`}
          </div>
        </div>
      `;
    }

    function renderUploadAdModal() {
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){ui.uploadAdModalOpen=false;render();}">
          <form class="modal-card" style="max-width:560px;display:flex;flex-direction:column;gap:12px;" onsubmit="handleAdSubmit(event)">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h2>Upload Movie Teaser, Song or YouTube Ad</h2>
              <button type="button" class="btn btn-outline" onclick="ui.uploadAdModalOpen=false;render()">✕</button>
            </div>
            <p style="font-size:0.78rem;color:var(--text-secondary);">All ad placements require Website Admin Team approval before appearing on the Home Page.</p>
            <div>
              <label class="label">Ad Slot Category *</label>
              <select name="type" class="select">
                <option value="movie_teaser">Movie Teaser / Song / Announcement</option>
                <option value="pvt_ad">Private Ad (Pvt Ad)</option>
                <option value="special_ad">Special Ad / Casting Call</option>
              </select>
            </div>
            <div><label class="label">Title *</label><input name="title" class="input" required /></div>
            <div><label class="label">Production Banner / Sponsor Name *</label><input name="banner" class="input" required /></div>
            <div><label class="label">YouTube Video Link *</label><input name="youtubeUrl" class="input" required placeholder="https://www.youtube.com/watch?v=..." /></div>
            <button type="submit" class="btn btn-primary" style="padding:12px;">Submit for Admin Approval</button>
          </form>
        </div>
      `;
    }

    function renderFooter() {
      return `
        <footer style="background:var(--surface);border-top:1px solid var(--border);padding:28px 20px;margin-top:40px;">
          <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:0.8rem;color:var(--text-secondary);">
            <div>
              <strong style="color:var(--text);font-size:0.95rem;">24crofts.com — Cinema 24 Crafts Talent & Production Platform</strong>
              <div>Email: ${db.siteSettings.contactEmail} · Mobile: +91 ${db.siteSettings.contactPhone} · ${db.siteSettings.contactLocation}</div>
            </div>
            <div style="display:flex;gap:14px;">
              <button class="nav-btn" onclick="navTo('home')">Home</button>
              <button class="nav-btn" onclick="navTo('crafts')">24 Crafts</button>
              <button class="nav-btn" onclick="navTo('register')">Register</button>
              <button class="nav-btn" onclick="navTo('login')">Login</button>
            </div>
          </div>
        </footer>
      `;
    }

    // =========================================================================
    // 10. INTERACTION HANDLERS
    // =========================================================================
    function navTo(sec) {
      ui.section = sec;
      ui.selectedCraftId = null;
      window.scrollTo(0, 0);
      render();
    }

    function openVideo(url) {
      ui.activeYoutubeUrl = url;
      render();
    }

    function shareProfile(id) {
      const url = window.location.origin + window.location.pathname + '?profile=' + id;
      if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
      showToast('Shareable Profile ID Link Copied: ' + url);
    }

    function handleIdSearch(e) {
      e.preventDefault();
      const q = (ui.searchQuery || '').trim().toUpperCase();
      if (!q) return;
      const exact = db.profiles.find(p => p.id.toUpperCase() === q || p.id.toUpperCase() === '24C-' + q || p.fullName.toUpperCase().includes(q));
      if (exact) {
        ui.activeProfileId = exact.id;
        render();
      } else {
        showToast('No profile matched "' + ui.searchQuery + '".');
      }
    }

    function handleRoleLogin(e, role) {
      e.preventDefault();
      if (role === 'admin') {
        const u = document.getElementById('login-admin-user').value.trim();
        const p = document.getElementById('login-admin-pass').value;
        if (u.toLowerCase() === db.adminCreds.username.toLowerCase() && p === db.adminCreds.password) {
          ui.viewer = { role: 'admin', username: u, displayName: 'Website Admin', canViewContacts: true };
          ui.section = 'admin';
          showToast('Signed in to Website Admin Command Center.');
          return;
        }
        showToast('Invalid Website Admin User ID or Password.');
        return;
      }

      if (role === 'production_house') {
        const u = document.getElementById('login-studio-user').value.trim();
        const p = document.getElementById('login-studio-pass').value;
        const studio = db.productionHouses.find(s => s.username.toLowerCase() === u.toLowerCase() && s.password === p);
        if (studio) {
          ui.viewer = { role: 'production_house', username: studio.username, displayName: studio.bannerName, canViewContacts: studio.canViewContacts };
          ui.section = 'home';
          showToast('Signed in as ' + studio.bannerName);
          return;
        }
        showToast('Invalid Production House User ID or Password.');
        return;
      }

      if (role === 'talent') {
        const u = document.getElementById('login-talent-user').value.trim();
        const p = document.getElementById('login-talent-pass').value;
        const prof = db.profiles.find(item => (item.username.toLowerCase() === u.toLowerCase() || item.id.toLowerCase() === u.toLowerCase()) && item.password === p);
        if (prof) {
          ui.viewer = { role: 'talent', username: prof.username, displayName: prof.fullName + ' (' + prof.id + ')', canViewContacts: false };
          ui.activeProfileId = prof.id;
          ui.section = 'home';
          showToast('Signed in to 24 Crafts Profile ' + prof.id);
          return;
        }
        showToast('Invalid 24 Crafts Category User ID or Password.');
      }
    }

    function handleLogout() {
      ui.viewer = { role: 'guest', username: '', displayName: '', canViewContacts: false };
      ui.section = 'home';
      showToast('Signed out safely.');
    }

    function handlePhotoUpload(e) {
      const files = Array.from(e.target.files || []).slice(0, 25);
      ui.tempPhotos = [];
      files.forEach(file => {
        const r = new FileReader();
        r.onload = () => { if (typeof r.result === 'string' && ui.tempPhotos.length < 25) { ui.tempPhotos.push(r.result); render(); } };
        r.readAsDataURL(file);
      });
    }

    function handleTalentRegister(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const newNum = 1001 + db.profiles.length;
      const id = '24C-' + newNum;
      const phone = String(fd.get('phone') || '9848000000');
      const newProf = {
        id,
        username: String(fd.get('username')),
        password: String(fd.get('password')),
        fullName: String(fd.get('fullName')),
        screenName: String(fd.get('screenName')),
        craftId: String(fd.get('craftId')),
        subCategory: String(fd.get('subCategory')),
        industry: String(fd.get('industry')),
        languages: ['Telugu', 'English'],
        city: String(fd.get('city')),
        area: String(fd.get('area')),
        state: 'Telangana',
        aadhaarMasked: 'XXXX-XXXX-' + String(fd.get('aadhaar')).slice(-4),
        aadhaarFull: String(fd.get('aadhaar')),
        phoneMasked: '+91 ••••• •••' + phone.slice(-2),
        phoneFull: '+91 ' + phone,
        emailFull: String(fd.get('username')) + '@24crofts.com',
        experienceYears: 3,
        isPaid: fd.get('isPaid') === 'true',
        uploadedToday: true,
        createdAt: Date.now(),
        bio: 'Verified 24crofts.com Professional (' + id + ').',
        photos: ui.tempPhotos.length ? ui.tempPhotos : [MALE_PHOTOS[0]],
        youtubeLinks: [String(fd.get('youtubeUrl') || 'https://www.youtube.com/watch?v=ScMzIvxBSi4')],
        viewsCount: 1,
        castingDetails: {
          age: Number(fd.get('age') || 24),
          height: String(fd.get('height') || '5 ft 8 in'),
          weight: String(fd.get('weight') || '62 kg'),
          bust: String(fd.get('bust') || '36 in'),
          waist: String(fd.get('waist') || '28 in'),
          hip: String(fd.get('hip') || '36 in'),
          skinTone: String(fd.get('skinTone') || 'Wheatish'),
          eyeColour: String(fd.get('eyeColour') || 'Brown'),
          hairColour: String(fd.get('hairColour') || 'Black'),
          shoeSize: String(fd.get('shoeSize') || 'UK 8'),
          passport: String(fd.get('passport') || 'Yes'),
          instagramId: String(fd.get('instagramId') || '@24crofts'),
          interestedIn: fd.getAll('interestedIn'),
          comfortableWith: fd.getAll('comfortableWith')
        }
      };
      db.profiles.unshift(newProf);
      saveDb();
      ui.section = 'home';
      ui.activeProfileId = id;
      showToast('Registered! Your Unique Profile ID is ' + id);
    }

    function handleStudioRegister(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = 'PH-' + (501 + db.productionHouses.length);
      db.productionHouses.unshift({
        id,
        bannerName: String(fd.get('bannerName')),
        producerName: String(fd.get('producerName')),
        username: String(fd.get('username')),
        password: String(fd.get('password')),
        industry: 'Tollywood',
        city: String(fd.get('city')),
        aadhaarMasked: 'XXXX-XXXX-' + String(fd.get('aadhaar')).slice(-4),
        movieFormName: 'Uploaded_Movie_Registration_Form.pdf',
        phone: String(fd.get('phone')),
        isApproved: false,
        canViewContacts: false
      });
      saveDb();
      ui.section = 'login';
      showToast('Production House submitted! Admin approval required to unlock talent contacts.');
    }

    function handleAdSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      db.ads.unshift({
        id: 'AD-' + Date.now(),
        type: String(fd.get('type')),
        title: String(fd.get('title')),
        subtitle: 'Submitted via 24crofts.com',
        banner: String(fd.get('banner')),
        youtubeUrl: String(fd.get('youtubeUrl')),
        image: 'https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?auto=format&fit=crop&w=1000&q=80',
        priorityOrder: ui.viewer.role === 'admin' ? 1 : 99,
        status: ui.viewer.role === 'admin' ? 'approved' : 'pending'
      });
      saveDb();
      ui.uploadAdModalOpen = false;
      showToast(ui.viewer.role === 'admin' ? 'Ad published live!' : 'Ad queued for Admin approval!');
    }

    function togglePaid(id) {
      const p = db.profiles.find(x => x.id === id);
      if (p) { p.isPaid = !p.isPaid; saveDb(); render(); }
    }

    function toggleStudio(id) {
      const s = db.productionHouses.find(x => x.id === id);
      if (s) { s.canViewContacts = !s.canViewContacts; s.isApproved = s.canViewContacts; saveDb(); render(); }
    }

    function moveAd(id, delta) {
      const a = db.ads.find(x => x.id === id);
      if (a) { a.priorityOrder = Math.max(1, a.priorityOrder + delta); saveDb(); render(); }
    }

    function toggleAdStatus(id) {
      const a = db.ads.find(x => x.id === id);
      if (a) { a.status = a.status === 'approved' ? 'pending' : 'approved'; saveDb(); render(); }
    }

    render();
  </script>
</body>
</html>
